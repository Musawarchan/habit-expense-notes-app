name: smartlife_app
description: "SmartLife - AI-Powered Productivity Companion"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # UI & Navigation
  cupertino_icons: ^1.0.8
  go_router: ^16.2.4
  flutter_svg: ^2.0.10+1
  
  # State Management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.5
  
  # Firebase
  firebase_core: ^4.1.1
  firebase_auth: ^6.1.0
  cloud_firestore: ^6.0.2
  firebase_storage: ^13.0.2
  firebase_messaging: ^16.0.2
  
  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # HTTP & API
  http: ^1.2.2
  dio: ^5.7.0
  
  # Charts & Analytics
  fl_chart: ^1.1.1
  
  # Date & Time
  intl: ^0.20.2
  
  # Image & File Handling
  image_picker: ^1.1.2
  path_provider: ^2.1.4
  
  # Notifications
  flutter_local_notifications: ^19.4.2
  
  # Utilities
  uuid: ^4.5.1
  shared_preferences: ^2.3.2
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
